<!--
  Root layout: a dark admin sidebar with the persistent navigation menu, and the
  routed page rendered next to it. Every page of the admin site is shown inside
  this shell, so the menu never disappears.
-->
<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="Charity Events admin home">
      <span class="brand__mark" aria-hidden="true">CE</span>
      <span class="brand__text">
        <strong>Charity Events</strong>
        <small>Admin console</small>
      </span>
    </a>

    <!-- Persistent navigation: RouterLinkActive marks the current page. -->
    <nav class="nav" aria-label="Main navigation">
      @for (item of navItems; track item.path) {
        <a
          class="nav__link"
          [routerLink]="item.path"
          routerLinkActive="nav__link--active"
          [routerLinkActiveOptions]="{ exact: item.path === '/events' }"
        >
          <span class="nav__icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <!-- Live API status from GET /api/health (click to re-check). -->
      <button
        type="button"
        class="health"
        [class]="'health health--' + health()"
        (click)="refreshHealth()"
        title="Re-check GET /api/health"
      >
        <span class="health__dot" aria-hidden="true"></span>
        @switch (health()) {
          @case ('connected') { API online · MySQL }
          @case ('demo') { API online · demo data }
          @case ('offline') { API offline }
          @default { Checking API… }
        }
      </button>
      <p class="sidebar__note">PROG2002 Web Development II · Assessment 3</p>
      <p class="sidebar__note">&copy; {{ year }} SCU Charity Events</p>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
